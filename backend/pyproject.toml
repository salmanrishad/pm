[project]
name = "pm-backend"
version = "0.1.0"
description = "Backend for the Project Management MVP"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Starlette's TestClient wants httpx2; plain httpx is deprecated for it.
    "httpx2>=2.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
